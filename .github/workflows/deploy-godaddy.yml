name: Deploy to GoDaddy

on:
  workflow_dispatch: # Ermöglicht manuelles Ausführen per Button in GitHub
  # push:
  #   branches: [ main ] # Erst beim tatsächlichen Go-Live einkommentieren

env:
  PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ vars.PUBLIC_WEB3FORMS_GODADDY_KEY }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Astro Site
        run: npm run build

      - name: Run build tests
        run: npm test

      - name: Deploy via SFTP
        uses: SamKirsch/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.GODADDY_SERVER }}
          username: ${{ secrets.GODADDY_USERNAME }}
          password: ${{ secrets.GODADDY_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.GODADDY_TARGET_DIR || '/public_html/' }}
